name: Build OpenMW Arabic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Add 8GB Swap Space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 unzip pkg-config p7zip-full curl git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Setup Android NDK
        working-directory: source/buildscripts
        run: |
          chmod +x build.sh clean.sh include/*.sh patches/openmw051-final/*.py
          ARCH=arm64 ./include/download-ndk.sh
          ARCH=arm64 ./include/setup-ndk.sh

      - name: Build Native C++ Engine (ARM64 + Arabic)
        working-directory: source/buildscripts
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          MAKEFLAGS: "-j2"
        run: |
          ./build.sh --arch arm64
          sha256sum ../app/src/main/jniLibs/arm64-v8a/libopenmw.so > openmw-051-patch39-libopenmw.sha256

      - name: Assemble Android APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assembleMainlineDebug

      - name: Upload Arabic APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW-Arabic-arm64-APK
          path: source/app/build/outputs/apk/mainline/debug/*.apk
